schema: spec-driven

context: |
  Tech stack: Next.js (App Router) + TypeScript + Tailwind CSS + shadcn/ui
  AI: Hugging Face Inference API (Qwen models), two-pass architecture (text-to-SQL + response formatting)
  Database: Supabase (PostgreSQL) — tables: transactions, rentals, etl_log
  ETL: Python scripts via GitHub Actions (cron: 每月 2/12/22 號)
  CI: GitHub Actions (lint + typecheck + build + vitest)
  Hosting: Vercel Hobby
  Testing: Vitest (unit tests for pure functions only)
  Domain: 台灣不動產實價登錄 AI 自然語言查詢系統
  Language: 使用者介面與 AI 回覆為繁體中文，程式碼與文件為英文
  Conventions: conventional commits, Co-Authored-By trailer

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section when scope is ambiguous
  design:
    - Include alternatives considered for each decision
    - Note Vercel Hobby limits (60s timeout, 100K invocations/month)
  tasks:
    - Break tasks into chunks completable in one session
    - Include a verification step at the end

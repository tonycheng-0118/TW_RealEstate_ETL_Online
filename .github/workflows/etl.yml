# ETL workflow — downloads Taiwan real estate data from Ministry of Interior,
# transforms CSV files, and loads into Supabase PostgreSQL.
#
# Modes:
#   import — download, transform, and load data (default)
#   delete — remove data for specified season(s)
#
# Season parameters:
#   start_season — empty = current season
#   end_season   — empty = start through current season
#   Both empty = current season only
#
# Schedule: 2nd, 12th, 22nd of each month at 03:00 UTC+8 (19:00 UTC).

name: ETL - Real Estate Data Import

on:
  schedule:
    # UTC 19:00 = UTC+8 03:00 — always runs import with current season
    - cron: "0 19 2,12,22 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - delete
      start_season:
        description: "Start season (e.g. 113S1). Empty = current season."
        required: false
      end_season:
        description: "End season (e.g. 114S4). Empty = start through current."
        required: false
      city:
        description: "City codes (e.g. A,F,H or 'all'). Default: all"
        required: false
        default: "all"

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "etl/requirements.txt"

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_ETL_DB_URL }}
          REALPRICE_TARGET_CITIES: ${{ github.event.inputs.city || 'all' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'import' }}"
          START="${{ github.event.inputs.start_season }}"
          END="${{ github.event.inputs.end_season }}"
          CITY="${{ github.event.inputs.city || 'all' }}"

          # Build --start/--end flags (only if non-empty)
          START_FLAG=""
          END_FLAG=""
          if [ -n "$START" ]; then
            START_FLAG="--start $START"
          fi
          if [ -n "$END" ]; then
            END_FLAG="--end $END"
          fi

          if [ "$MODE" = "import" ]; then
            python etl/scripts/run_etl.py $START_FLAG $END_FLAG --city "$CITY"
          elif [ "$MODE" = "delete" ]; then
            python etl/scripts/delete.py $START_FLAG $END_FLAG --city "$CITY"
          fi

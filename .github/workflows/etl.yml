# ETL workflow — downloads Taiwan real estate data from Ministry of Interior,
# transforms CSV files, and loads into Supabase PostgreSQL.
#
# Schedule: 2nd, 12th, 22nd of each month at 03:00 UTC+8 (19:00 UTC).
# Can also be triggered manually via workflow_dispatch.

name: ETL - Real Estate Data Import

on:
  schedule:
    # UTC 19:00 = UTC+8 03:00
    - cron: "0 19 2,12,22 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ETL mode"
        required: true
        default: "current"
        type: choice
        options:
          - current
          - season
      season:
        description: "Season (e.g. 114S1), only used when mode=season"
        required: false
      city:
        description: "City codes (e.g. A,F,H or 'all'). Default: all"
        required: false
        default: "all"

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "etl/requirements.txt"

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_ETL_DB_URL }}
          REALPRICE_TARGET_CITIES: ${{ github.event.inputs.city || 'all' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "season" ] && [ -n "${{ github.event.inputs.season }}" ]; then
            python etl/scripts/run_etl.py --season "${{ github.event.inputs.season }}" --city "${{ github.event.inputs.city || 'all' }}"
          else
            python etl/scripts/run_etl.py --current --city "${{ github.event.inputs.city || 'all' }}"
          fi

# ETL workflow — downloads Taiwan real estate data from Ministry of Interior,
# transforms CSV files, and loads into Supabase PostgreSQL.
#
# Modes:
#   current — fetch latest period (default, used by cron)
#   season  — fetch a single season (e.g. 114S1)
#   range   — fetch a range of seasons (e.g. 113S1 to 114S4)
#   delete  — delete data for a specific season (manual only)
#
# Schedule: 2nd, 12th, 22nd of each month at 03:00 UTC+8 (19:00 UTC).

name: ETL - Real Estate Data Import

on:
  schedule:
    # UTC 19:00 = UTC+8 03:00 — always runs 'current' mode
    - cron: "0 19 2,12,22 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ETL mode"
        required: true
        default: "current"
        type: choice
        options:
          - current
          - season
          - range
          - delete
      season:
        description: "Season (e.g. 114S1). Used by 'season' and 'delete' modes."
        required: false
      from_season:
        description: "Start season (e.g. 113S1). Used by 'range' mode."
        required: false
      to_season:
        description: "End season (e.g. 114S4). Used by 'range' mode."
        required: false
      city:
        description: "City codes (e.g. A,F,H or 'all'). Default: all"
        required: false
        default: "all"

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "etl/requirements.txt"

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_ETL_DB_URL }}
          REALPRICE_TARGET_CITIES: ${{ github.event.inputs.city || 'all' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'current' }}"
          CITY="${{ github.event.inputs.city || 'all' }}"

          case "$MODE" in
            current)
              python etl/scripts/run_etl.py --current --city "$CITY"
              ;;
            season)
              python etl/scripts/run_etl.py --season "${{ github.event.inputs.season }}" --city "$CITY"
              ;;
            range)
              python etl/scripts/run_etl.py --from "${{ github.event.inputs.from_season }}" --to "${{ github.event.inputs.to_season }}" --city "$CITY"
              ;;
            delete)
              CITY_FLAG=""
              if [ "$CITY" != "all" ]; then
                CITY_FLAG="--city $CITY"
              fi
              python etl/scripts/delete.py --season "${{ github.event.inputs.season }}" $CITY_FLAG
              ;;
          esac
